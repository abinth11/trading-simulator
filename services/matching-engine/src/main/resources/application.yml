server:
  port: 8083

spring:
  application:
    name: matching-engine

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tradingsim
    username: tradingsim
    password: tradingsim123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: matching-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tradingsim.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.tradingsim.matching.consumer.OrderPlacedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topics:
    order-placed: order.placed
    order-cancelled: order.cancelled
    trade-executed: trade.executed
    price-updated: price.updated

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.tradingsim: DEBUG
