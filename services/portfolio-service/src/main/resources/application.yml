server:
  port: 8084

spring:
  application:
    name: portfolio-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tradingsim
    username: tradingsim
    password: tradingsim123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: portfolio-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tradingsim.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.tradingsim.portfolio.consumer.TradeExecutedEvent

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

kafka:
  topics:
    trade-executed: trade.executed

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.tradingsim: DEBUG
