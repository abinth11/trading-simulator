server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tradingsim
    username: tradingsim
    password: tradingsim123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update # schema managed by init.sql, not Hibernate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Virtual threads (Java 21) — makes Spring MVC non-blocking for free
  threads:
    virtual:
      enabled: true

# Operator account for the admin dashboard, created on startup if missing.
# Local-dev defaults — override with ADMIN_EMAIL / ADMIN_PASSWORD, or set them blank to disable.
admin:
  bootstrap:
    email: ${ADMIN_EMAIL:admin@tradingsim.dev}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin12345}

# JWT config — change secret in production!
jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  access-token-expiry-ms: 900000 # 15 minutes
  refresh-token-expiry-ms: 604800000 # 7 days

# Actuator — expose prometheus endpoint
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.tradingsim: DEBUG
    org.springframework.security: INFO
