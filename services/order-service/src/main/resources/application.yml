server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tradingsim
    username: tradingsim
    password: tradingsim123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

kafka:
  topics:
    order-placed: order.placed
    order-cancelled: order.cancelled
    trade-executed: trade.executed

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

trading:
  # MARKET orders fill no further than this % from the reference price; unfilled remainder is cancelled
  market-protection-pct: 5

market-data:
  # How often to refresh NSE prices from Yahoo Finance (milliseconds). Default: 5 minutes.
  refresh-interval-ms: 300000

logging:
  level:
    com.tradingsim: DEBUG
